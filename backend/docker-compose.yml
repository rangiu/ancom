services:
  ancom-backend:
    build: .
    container_name: ancom-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ancom_data:/app/data
    environment:
      - PORT=4000
      - ALLOWED_ORIGINS=https://ancom-coral.vercel.app,http://localhost:5173
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_DAILY_LIMIT_PER_DEVICE=${AI_DAILY_LIMIT_PER_DEVICE:-8}
      - AI_DAILY_GLOBAL_LIMIT=${AI_DAILY_GLOBAL_LIMIT:-400}

volumes:
  ancom_data:
